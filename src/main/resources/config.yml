# ============================================================================
#  NetherPearlLoader
#  只在地獄(NETHER)對飛行中的終界珍珠強制載入區塊。
#
#  ★ 主世界(NORMAL)與終界(THE_END)完全不介入。
#    主世界的「32 級弱載入卡珍珠蓄力(珍珠炮)」機制依賴珍珠停在未 tick 的
#    區塊上,只要對它 forceload 就會被破壞,所以 nether-only 預設為 true,
#    且插件在 nether-only=true 時連讀都不會去讀非地獄世界的珍珠。
# ============================================================================

# 半徑(以珍珠所在區塊為中心的方形半徑)。
#   0 = 只載入珍珠當下那一個區塊
#   1 = 3x3   2 = 5x5   3 = 7x7 ...
# 載入的區塊數是 (2r+1)^2,調大會直線增加伺服器負擔。
radius: 1

# 掃描間隔(tick)。1 = 每 tick 掃一次,反應最快也最耗效能。
interval-ticks: 1

# 只在地獄生效。除非你很清楚自己在做什麼,否則不要改成 false
# (false 會連主世界的珍珠一起 forceload,珍珠炮蓄力會壞掉)。
nether-only: true

# 主控台輸出追蹤訊息(每顆珍珠的座標、速度、佔用區塊數增減)。
debug: false

# --- 進階:動量預測鋪路 ------------------------------------------------------
# 反應式掃描永遠慢珍珠一步(掃到時珍珠已經到了)。開啟後會讀珍珠的 Motion
# 向量,沿著它下一 tick 的行進路線預先把沿途區塊鋪好,減少「撞牆卡住」次數。
predict:
  enabled: true

  # 鋪路策略:
  #   corridor = 沿行進路線整條鋪。低速時沿途碰撞判定才會正常運作,但成本與速度成正比
  #              (1750 格/tick 要 327 區塊/tick,不可能)。
  #   landing  = 只鋪未來每個 tick 的「落點」。成本 = ticks x (2r+1)^2,與速度完全無關。
  #              實測證實珍珠一個 tick 能直接穿過上百個未載入區塊,沿途根本不需要載入;
  #              它只需要停下來的那一格是 31 級 entity ticking 才能繼續飛。
  #   auto     = 走廊塞不進 max-chunks-per-pearl 時自動切成 landing(建議)。
  mode: auto

  # 往前預測幾 tick。這個值應該 >= 你伺服器「區塊從無到升上 31 級」的延遲,
  # 否則路鋪好之前珍珠就到了。實測全新地獄區塊約 5-6 tick,建議 8。
  ticks: 1
  # 每顆珍珠單次最多佔用的區塊數上限(安全閥)。
  # 珍珠速度可能高達每 tick 數百個區塊,沒有上限的話一 tick 就會要求載入
  # 上萬個區塊,直接把伺服器打死。超過上限時只鋪「離珍珠最近」的那一段。
  max-chunks-per-pearl: 256

# --- 蓄力保護:讓「弱加載蓄力」和「地獄飛行加載」並存 -------------------------
# 蓄力中的珍珠要 32 級(載入但不 tick,珍珠才會凍住累積動量),飛行中的珍珠要 31 級
# (entity ticking,珍珠才會動)——需求完全相反。而且兩者從 API 看一模一樣:都有巨大
# Motion、都靜止不動(飛行中的珍珠在等區塊時同樣不動)。所以用兩層保護分開:
stasis-protection:

  # [第一層,自動] 珍珠要「動過一次」才會被接管。
  # 蓄力中的珍珠因為不被 tick 所以永遠不動,插件不會碰它;你放行它的那一刻它動了第一格,
  # 插件才開始鋪路。零設定。
  # 缺點:這份記憶存在記憶體,插件 reload 會清掉——reload 當下正卡在半路等區塊的珍珠
  # 會被當成陌生珍珠,要等它再動一格才會重新被接管。在意的話用下面第二層。
  skip-idle-pearls: true

  # [第二層,確定性] 炮膛區塊白名單:列在這裡的區塊永遠不會被 forceload,
  # 待在裡面的珍珠也永遠不會被追蹤。不受 reload、不受偵測邏輯影響,是最可靠的保護。
  # 座標是「區塊座標」= 方塊座標 / 16(向下取整)。範圍含頭含尾。
  protected-chunks: []
  # 範例:炮膛在地獄 x=-80..80, z=-80..80(方塊)= 區塊 -5..5
  # protected-chunks:
  #   - world: world_nether
  #     from: [-5, -5]
  #     to: [5, 5]

# --- 進階:殘留 forceload 清理 -----------------------------------------------
# 正常 onDisable 會把所有本插件加的 forceload 清乾淨;但伺服器如果是被 kill
# /當機收掉的,forceload 旗標會留在存檔裡永遠釘住區塊。開啟後插件會把自己
# 目前佔用的區塊寫進 data/forceloaded.txt(非同步、節流寫入),下次啟動時
# 依這份紀錄把上一輪的殘留清掉。
recover-on-enable: true

# 上述紀錄檔的最小寫入間隔(tick)。100 = 每 5 秒最多寫一次。
journal-interval-ticks: 100
