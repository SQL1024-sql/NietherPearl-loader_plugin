# ============================================================================
#  NetherPearlLoader
#  只在地獄(NETHER)對飛行中的終界珍珠強制載入區塊。
#
#  ★ 主世界(NORMAL)與終界(THE_END)完全不介入。
#    主世界的「32 級弱載入卡珍珠蓄力(珍珠炮)」機制依賴珍珠停在未 tick 的
#    區塊上,只要對它 forceload 就會被破壞,所以 nether-only 預設為 true,
#    且插件在 nether-only=true 時連讀都不會去讀非地獄世界的珍珠。
# ============================================================================

# 半徑(以珍珠所在區塊為中心的方形半徑)。
#   0 = 只載入珍珠當下那一個區塊
#   1 = 3x3   2 = 5x5   3 = 7x7 ...
# 載入的區塊數是 (2r+1)^2,調大會直線增加伺服器負擔。
radius: 1

# 掃描間隔(tick)。1 = 每 tick 掃一次,反應最快也最耗效能。
interval-ticks: 1

# 只在地獄生效。除非你很清楚自己在做什麼,否則不要改成 false
# (false 會連主世界的珍珠一起 forceload,珍珠炮蓄力會壞掉)。
nether-only: true

# 主控台輸出追蹤訊息(每顆珍珠的座標、速度、佔用區塊數增減)。
debug: false

# --- 進階:動量預測鋪路 ------------------------------------------------------
# 反應式掃描永遠慢珍珠一步(掃到時珍珠已經到了)。開啟後會讀珍珠的 Motion
# 向量,沿著它下一 tick 的行進路線預先把沿途區塊鋪好,減少「撞牆卡住」次數。
predict:
  enabled: true
  # 往前預測幾 tick。1 代表只鋪下一 tick 的路;數字越大鋪得越前面也越貴。
  ticks: 1
  # 每顆珍珠單次最多佔用的區塊數上限(安全閥)。
  # 珍珠速度可能高達每 tick 數百個區塊,沒有上限的話一 tick 就會要求載入
  # 上萬個區塊,直接把伺服器打死。超過上限時只鋪「離珍珠最近」的那一段。
  max-chunks-per-pearl: 256

# --- 進階:殘留 forceload 清理 -----------------------------------------------
# 正常 onDisable 會把所有本插件加的 forceload 清乾淨;但伺服器如果是被 kill
# /當機收掉的,forceload 旗標會留在存檔裡永遠釘住區塊。開啟後插件會把自己
# 目前佔用的區塊寫進 data/forceloaded.txt(非同步、節流寫入),下次啟動時
# 依這份紀錄把上一輪的殘留清掉。
recover-on-enable: true

# 上述紀錄檔的最小寫入間隔(tick)。100 = 每 5 秒最多寫一次。
journal-interval-ticks: 100
